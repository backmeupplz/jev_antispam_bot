name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Production builds the Dockerfile; its FROM lines must use this same version.
  BUN_VERSION: 1.4.4

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Reached by service name; publishing a host port would collide with parallel jobs.
      # The data dir is a tmpfs: initdb and the tests no longer wait on the runner's busy disk.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jev_stats_test
          POSTGRES_USER: jev_stats_test
          POSTGRES_PASSWORD: test-only-password
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U jev_stats_test -d jev_stats_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # The tests refuse any database host but 127.0.0.1/localhost, so the run step forwards
      # 127.0.0.1:5432 to the service
      TEST_DATABASE_URL: postgres://jev_stats_test:test-only-password@127.0.0.1:5432/jev_stats_test
    steps:
      - uses: actions/checkout@v4
      # The production image builds from these FROM lines and runs `bun run check` itself, so
      # CI checks the same Bun version instead of building the image (jobs have no Docker daemon).
      - name: Dockerfile uses the CI Bun version
        run: |
          froms=$(grep -E '^FROM ' Dockerfile)
          echo "$froms"
          if [ -z "$froms" ] || echo "$froms" | grep -v -E "^FROM oven/bun:${BUN_VERSION}-slim( AS [a-z]+)?$"; then
            echo "::error file=Dockerfile::every FROM must be oven/bun:${BUN_VERSION}-slim"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # `bun run check` (typecheck && test), with both halves in parallel
      - run: |
          python3 -c '
          import asyncio
          async def pipe(r, w):
              while data := await r.read(65536):
                  w.write(data)
                  await w.drain()
              w.write_eof()
          async def handle(r, w):
              r2, w2 = await asyncio.open_connection("postgres", 5432)
              await asyncio.gather(pipe(r, w2), pipe(r2, w))
          async def main():
              await (await asyncio.start_server(handle, "127.0.0.1", 5432)).serve_forever()
          asyncio.run(main())' >/dev/null 2>&1 &
          forward=$!
          until (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; do sleep 0.1; done
          bun run typecheck & typecheck=$!
          bun test & tests=$!
          wait $typecheck; a=$?
          wait $tests; b=$?
          kill $forward
          [ $a = 0 ] && [ $b = 0 ]
        env:
          AUDIT_TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

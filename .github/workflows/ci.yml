name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jev_stats_test
          POSTGRES_USER: jev_stats_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jev_stats_test -d jev_stats_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://jev_stats_test:test-only-password@127.0.0.1:5432/jev_stats_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
